<script>
if (window.decomp && Matter?.Common?.setDecomp) {
  Matter.Common.setDecomp(window.decomp);
}

const snake = document.getElementById("snake");
const s1 = document.getElementById("snake1");
const s2 = document.getElementById("snake2");
const s3 = document.getElementById("snake3");
const s4 = document.getElementById("snake4");
const snake1Pieces = document.getElementById("snake1Pieces");
const snake2Pieces = document.getElementById("snake2Pieces");
const snake3Pieces = document.getElementById("snake3Pieces");
const snake4Pieces = document.getElementById("snake4Pieces");
const overlay = document.getElementById("overlay");

window.scrollTo(0, 0);

createNavTriangleBodies();

function resetSnakes() {
  if (greenBroken) {
    brokenGreenPieces.forEach(({ body }) => Matter.Composite.remove(engine.world, body));
    brokenGreenPieces = [];
    greenBroken = false;
    s1.style.opacity = 1;
    snake1Pieces.style.opacity = 0;
  }
  if (whiteBroken) {
    brokenWhitePieces.forEach(({ body }) => Matter.Composite.remove(engine.world, body));
    brokenWhitePieces = [];
    whiteBroken = false;
    s2.style.opacity = 1;
    snake2Pieces.style.opacity = 0;
  }
  if (redBroken) {
    brokenRedPieces.forEach(({ body }) => Matter.Composite.remove(engine.world, body));
    brokenRedPieces = [];
    redBroken = false;
    s3.style.opacity = 1;
    snake3Pieces.style.opacity = 0;
  }
  if (blueBroken) {
    brokenBluePieces.forEach(({ body }) => Matter.Composite.remove(engine.world, body));
    brokenBluePieces = [];
    blueBroken = false;
    s4.style.opacity = 1;
    snake4Pieces.style.opacity = 0;
  }

  if (smashedPiecesSpawned) {
    smashedPieces.forEach((piece) => {
      if (piece.body) Matter.Composite.remove(engine.world, piece.body);
      piece.img.style.display = "none";
      piece.body = null;
      piece.spawned = false;
    });
    smashedPieceBodies.forEach((piece) => {
      if (piece.index >= smashedPieces.length) {
        if (piece.body) Matter.Composite.remove(engine.world, piece.body);
        piece.img.remove();
      }
    });
    smashedPieceBodies = [];
    smashedPiecesSpawned = false;
  }

  falling = false;
}

/* 背景 + 显示 */
function update() {
  try {
    let s = window.scrollY;
    let p = Math.min(s / window.innerHeight, 1); window.scrollProgress = p;

    document.body.style.background = `rgb(${247*p},${249*p},0)`;
    overlay.style.opacity = 1 - p;
    document.getElementById('bg-dark').style.opacity = p >= 0.8 ? 0 : (0.8 - p) / 0.8;

    const nav = document.getElementById("nav");

    if (s + window.innerHeight > document.body.scrollHeight - 100) {
      nav.style.opacity = 1;
      nav.style.transform = "translateY(0)";
    } else {
      nav.style.opacity = 0;
      nav.style.transform = "translateY(20px)";
    }

    let snakeOpacity = p >= 0.79 ? Math.min(1, (p - 0.79) / 0.21) : 0;
    snake.style.opacity = snakeOpacity;

    if (p < 0.01 && (greenBroken || whiteBroken || redBroken || blueBroken)) {
      resetSnakes();
  }

  } catch (e) {
    console.warn('update() error:', e);
  }

  requestAnimationFrame(update);
}
update();

function auraColorForScroll(t) {
  const lerp = (a, b, t) => Math.round(a + (b - a) * t);
  const lerpF = (a, b, t) => a + (b - a) * t;
  const w = [[254,255,254,.62,1],[193,242,210,.36,15],[138,148,142,.24,30],[185,220,185,.17,50],[158,175,159,.1,60],[240,245,240,.05,80]];
  const g = [[160,255,140,.7,1],[100,255,100,.42,15],[50,240,70,.28,30],[20,220,40,.2,50],[0,200,30,.12,60],[0,160,20,.06,80]];
  const stops = w.map((s, i) => `rgba(${lerp(s[0],g[i][0],t)},${lerp(s[1],g[i][1],t)},${lerp(s[2],g[i][2],t)},${lerpF(s[3],g[i][3],t)}) ${s[4]}%`);
  const bg = `radial-gradient(circle, ${stops.join(',')}, transparent 100%)`;
  const ws = [[228,234,228,.25,30],[221,246,187,.18,90]];
  const gs = [[100,255,100,.3,30],[50,240,70,.22,90]];
  const sh = ws.map((s, i) => `0 0 ${s[4]}px rgba(${lerp(s[0],gs[i][0],t)},${lerp(s[1],gs[i][1],t)},${lerp(s[2],gs[i][2],t)},${lerpF(s[3],gs[i][3],t)})`);
  return { background: bg, boxShadow: sh.join(',') };
}

s1.addEventListener("click", () => { if (!isSnakePage()) return; triggerMacClick(s1); explodeSnakes(); });
s2.addEventListener("click", () => { if (!isSnakePage()) return; triggerMacClick(s2); explodeSnakes(); });
s3.addEventListener("click", () => { if (!isSnakePage()) return; triggerMacClick(s3); explodeSnakes(); });
s4.addEventListener("click", () => { if (!isSnakePage()) return; triggerMacClick(s4); explodeSnakes(); });

  // Cursor aura — always visible, strongly bound to cursor
  setPostFrameCallback(function() {
    const now = performance.now();
    const deltaSec = Math.min(0.05, (now - lastAuraTime) / 1000);
    lastAuraTime = now;

    if (locked) {
      auraX = lastMouse.x;
      auraY = lastMouse.y;
    } else {
      const dx = lastMouse.x - auraX;
      const dy = lastMouse.y - auraY;
      const dist = Math.sqrt(dx * dx + dy * dy);
      if (!chasing && dist <= CHASE_RADIUS) { chasing = true; chaseStartTime = performance.now(); }
      if (chasing) {
        const elapsed = (performance.now() - chaseStartTime) / 1000;
      const speed = Math.min(700, 450 + elapsed * 200);
      const step = speed * deltaSec;
        if (dist <= step) {
          locked = true; chaseStartTime = 0;
          auraX = lastMouse.x;
          auraY = lastMouse.y;
        } else {
          auraX += (dx / dist) * step;
          auraY += (dy / dist) * step;
        }
      }
    }
    const breath = 0.5 + 0.5 * Math.sin(now * 0.0008);
    let opacity = 1 + breath * 0.90;
    let scale = 1;
    clickPulse *= 0.85;
    if (clickPulse > 0.001) {
      opacity += clickPulse * 0.12;
      scale = 1 + clickPulse * 0.35;
    }
    const auraColor = auraColorForScroll(window.scrollProgress || 0);
    cursorAura.style.background = auraColor.background;
    cursorAura.style.boxShadow = auraColor.boxShadow;
    cursorAura.style.opacity = opacity;
    cursorAura.style.transform = `translate(${auraX}px, ${auraY}px) translate(-50%, -50%) scale(${scale})`;
    cursorAuraSecondary.style.background = auraColor.background;
    cursorAuraSecondary.style.boxShadow = auraColor.boxShadow;
    cursorAuraSecondary.style.opacity = opacity * 0.5;
    cursorAuraSecondary.style.transform = `translate(${auraX}px, ${auraY}px) translate(-50%, -50%) scale(${scale * 0.85})`;
  });
</script>
