<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Dye Spread Concept</title>
<style>
  body {
    margin: 0;
    height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: #222;
    font-family: system-ui, sans-serif;
    color: #ccc;
    gap: 24px;
  }

  .container {
    position: relative;
    width: 700px;
    height: 400px;
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 8px 32px rgba(0,0,0,0.5);
    cursor: pointer;
    user-select: none;
  }

  #bg {
    position: absolute;
    inset: 0;
    background: #f7f900;
  }

  #dye {
    position: absolute;
    inset: 0;
    background: #00a02f;
    will-change: clip-path;
  }

  .controls {
    display: flex;
    align-items: center;
    gap: 16px;
    width: 700px;
  }

  input[type="range"] {
    flex: 1;
    accent-color: #00a02f;
  }

  .label-row {
    display: flex;
    gap: 32px;
    font-size: 14px;
    color: #888;
  }

  .label-row span {
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    display: inline-block;
  }
  .dot-yellow { background: #f7f900; }
  .dot-green  { background: #00a02f; }

  .toggle-group {
    display: flex;
    gap: 0;
    border: 1px solid #444;
    border-radius: 6px;
    overflow: hidden;
  }
  .toggle-group button {
    background: transparent;
    color: #ccc;
    border: none;
    padding: 6px 16px;
    cursor: pointer;
    font-size: 13px;
    transition: background 0.15s;
  }
  .toggle-group button.active {
    background: #00a02f;
    color: #fff;
  }
  .toggle-group button:not(:last-child) {
    border-right: 1px solid #444;
  }

  .tag {
    font-size: 12px;
    color: #666;
  }

  .hint {
    font-size: 13px;
    color: #555;
    margin-top: 4px;
  }
</style>
</head>
<body>

<div style="font-size:14px;color:#888;">
  点击图片播放 / 拖滑块手动控制 / 切换模式
</div>

<div class="container">
  <div id="bg"></div>
  <div id="dye"></div>
</div>

<div class="controls">
  <span style="font-size:12px;width:32px;text-align:right;">0%</span>
  <input type="range" id="progress" min="0" max="1000" value="0">
  <span style="font-size:12px;width:32px;">100%</span>
</div>

<div class="label-row">
  <span><span class="dot dot-yellow"></span> 黄色区域（尚未被侵蚀）</span>
  <span><span class="dot dot-green"></span> 绿色染料（已经侵蚀）</span>
</div>

<div class="toggle-group">
  <button id="btn-wave">矩形上移</button>
  <button id="btn-organic" class="active">有机扩散</button>
  <button id="btn-erode">侵蚀毛边</button>
</div>

<div id="modeLabel" class="tag">有机扩散 — 每个顶点独立偏移，产生参差不齐的侵蚀前沿</div>
<div class="hint">拖动滑块观察边界细节</div>

<script>
(function() {
  var dye = document.getElementById("dye");
  var slider = document.getElementById("progress");
  var btnWave = document.getElementById("btn-wave");
  var btnOrganic = document.getElementById("btn-organic");
  var btnErode = document.getElementById("btn-erode");
  var modeLabel = document.getElementById("modeLabel");

  var NUM_POINTS = 40;
  var mode = "organic";
  var animId = null;

  function buildPoints(progress, mode) {
    var topY = 1 - progress;
    var pts = [];

    for (var i = 0; i <= NUM_POINTS; i++) {
      var x = (i / NUM_POINTS) * 100;
      var y;

      if (mode === "wave") {
        y = topY * 100;
      } else if (mode === "organic") {
        var n = Math.sin(i * 7.3) * 0.5 + Math.cos(i * 11.2) * 0.3 + Math.sin(i * 3.7 + 1.4) * 0.2;
        var amp = 4 * (1 + 0.5 * Math.sin(progress * Math.PI));
        y = Math.max(0, Math.min(100, topY * 100 + n * amp));
      } else {
        var n = Math.sin(i * 5.1) * 0.6 + Math.cos(i * 8.3) * 0.4 + Math.sin(i * 2.9 + progress * 10) * 0.3;
        var amp = 8 * (0.5 + progress * 0.5);
        y = Math.max(0, Math.min(100, topY * 100 + n * amp));
      }

      pts.push(x.toFixed(2) + "% " + y.toFixed(2) + "%");
    }

    pts.push("100% 100%", "0% 100%");

    dye.style.clipPath = "polygon(" + pts.join(",") + ")";
  }

  function animateTo(targetProgress, duration) {
    if (duration === undefined) duration = 2000;
    if (animId) { cancelAnimationFrame(animId); animId = null; }
    var start = performance.now();
    var startVal = parseFloat(slider.value) / 1000;

    function tick(now) {
      var t = Math.min(1, (now - start) / duration);
      var ease = t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
      var val = startVal + (targetProgress - startVal) * ease;
      var rounded = Math.round(val * 1000);
      if (rounded > 1000) rounded = 1000;
      if (rounded < 0) rounded = 0;
      slider.value = rounded;
      buildPoints(val, mode);
      if (t < 1) {
        animId = requestAnimationFrame(tick);
      } else {
        animId = null;
      }
    }
    animId = requestAnimationFrame(tick);
  }

  document.querySelector(".container").addEventListener("click", function() {
    if (animId) { cancelAnimationFrame(animId); animId = null; }
    var current = parseFloat(slider.value) / 1000;
    var target = current < 0.5 ? 1 : 0;
    animateTo(target, 2000);
  });

  slider.addEventListener("input", function() {
    if (animId) { cancelAnimationFrame(animId); animId = null; }
    var val = parseFloat(slider.value) / 1000;
    buildPoints(val, mode);
  });

  btnWave.addEventListener("click", function() {
    mode = "wave";
    btnWave.classList.add("active");
    btnOrganic.classList.remove("active");
    btnErode.classList.remove("active");
    modeLabel.textContent = "矩形上移 — 所有顶点在同一水平线，机械感的平整边界";
    var val = parseFloat(slider.value) / 1000;
    buildPoints(val, mode);
  });

  btnOrganic.addEventListener("click", function() {
    mode = "organic";
    btnOrganic.classList.add("active");
    btnWave.classList.remove("active");
    btnErode.classList.remove("active");
    modeLabel.textContent = "有机扩散 — 每个顶点独立偏移，模拟染料沿纤维不均匀渗透";
    var val = parseFloat(slider.value) / 1000;
    buildPoints(val, mode);
  });

  btnErode.addEventListener("click", function() {
    mode = "erode";
    btnErode.classList.add("active");
    btnWave.classList.remove("active");
    btnOrganic.classList.remove("active");
    modeLabel.textContent = "侵蚀毛边 — 大振幅锯齿边界，模拟颜料侵蚀纸面";
    var val = parseFloat(slider.value) / 1000;
    buildPoints(val, mode);
  });

  buildPoints(0, "organic");
  slider.value = 0;
})();
</script>
</body>
</html>
